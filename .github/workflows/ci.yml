name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run soak -- all --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-reports
          path: soak-out/
          if-no-files-found: ignore
