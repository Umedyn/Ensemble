  <!-- the basin floor, kilometres down: dunes and old craters -->
  <path d="M0 330 C60 336 140 348 240 346 C360 344 460 334 560 316 C640 302 700 296 800 292 V560 H0 Z" fill="#241b18"/>
  <g fill="none" stroke="#33271f" stroke-width="2" stroke-linecap="round">
    <path d="M60 400 C120 388 180 392 240 404"/><path d="M90 430 C160 418 220 424 280 438"/><path d="M380 420 C450 404 520 408 580 424"/>
    <path d="M420 456 C490 442 560 446 620 462"/><path d="M160 500 C230 486 300 490 360 506"/><path d="M560 510 C630 496 700 500 760 514"/>
