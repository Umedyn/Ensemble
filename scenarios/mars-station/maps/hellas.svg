  <path d="M441 132 V150" stroke="#2d221e" stroke-width="3"/>
  <circle cx="300" cy="100" r="22" fill="#55514a" stroke="#8a8274" stroke-width="2.5"/>
  <circle cx="300" cy="100" r="9" fill="#4a4740"/>
