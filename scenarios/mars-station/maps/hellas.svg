  </g>
  <!-- rover tracks: garage down to the field, along the rim to the mast, a switchback into the basin -->
  <g fill="none" stroke="#5a4638" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round">
    <path d="M442 141 C470 160 490 180 505 200 C560 196 640 176 735 166"/>
    <path d="M505 200 C470 240 420 248 380 262 C340 276 300 300 320 340 C340 380 300 410 260 440"/>
    <path d="M380 262 C330 262 280 256 236 252"/>
