  </g>
  <g fill="#3a2c25"><circle cx="64" cy="54" r="22"/><circle cx="714" cy="49" r="19"/><circle cx="516" cy="56" r="16"/></g>
  <!-- the rim: terraced slopes falling toward the basin -->
  <path d="M0 192 C120 182 240 172 330 168 C440 162 480 158 560 148 C640 135 700 118 800 105 V292 C700 296 640 302 560 316 C460 334 360 344 240 346 C140 348 60 336 0 330 Z" fill="#33261f"/>
