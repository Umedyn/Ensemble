<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ensemble Creator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/creator.css">
<script>
// The game's appearance settings (theme, text size, motion), applied before first paint.
(function () {
  var a = {};
  try { a = (JSON.parse(localStorage.getItem('ensemble.settings')) || {}).appearance || {}; } catch (e) {}
  var el = document.documentElement, mq = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
  var theme = a.theme === 'system' ? (mq('(prefers-color-scheme: light)') ? 'light' : 'dark') : (a.theme || 'dark');
  el.setAttribute('data-theme', theme);
  el.setAttribute('data-font', a.storyFont === 'sans' ? 'sans' : 'serif');
  el.setAttribute('data-motion', a.motion === 'on' || (a.motion !== 'off' && mq('(prefers-reduced-motion: reduce)')) ? 'reduce' : 'full');
  el.style.setProperty('--text-scale', String(Math.min(150, Math.max(90, Number(a.textSize) || 100)) / 100));
})();
</script>
</head>
<body class="creator">
<header class="topbar">
  <div class="brand">Ensemble Creator</div>
  <div class="group">
    <select id="cWorld" title="World to edit" aria-label="World to edit"><option value="">Pick a world…</option></select>
    <label class="btn" title="Edit a world folder from your computer">Open folder<input type="file" id="cFolder" webkitdirectory directory multiple hidden></label>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="cExport" disabled title="Download the whole world folder as a zip">Export zip</button>
    <button id="cJson" disabled title="Download only world.json">world.json</button>
    <a class="btn" href="index.html">Back to the game</a>
  </div>
</header>
<div id="cBanner" class="c-banner hidden" role="status"></div>
<nav id="cTabs" class="c-tabs" aria-label="Creator sections"></nav>
<main id="cMain" class="c-main"><div class="c-empty">Pick a world to edit, or open a world folder from your computer.</div></main>
<section id="cValidation" class="c-validation" aria-live="polite"></section>

<script src="js/util.js"></script>
<script src="js/llm.js"></script>
<script src="js/recorder.js"></script>
<script src="js/memory.js"></script>
<script src="js/genres.js"></script>
<script src="js/prompts.js"></script>
<script src="js/engine.js"></script>
<script src="js/scenario.js"></script>
<script src="js/layouts.js"></script>
<script src="js/mapdraw.js"></script>
<script src="js/zip.js"></script>
<script src="js/mapedit.js"></script>
<script src="js/creator.js"></script>
</body>
</html>
