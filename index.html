<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d22">
<title>Ensemble</title>
<link rel="stylesheet" href="css/style.css">
<script>
// Appearance (Settings > Appearance), applied before first paint so the page
// never flashes the wrong theme. The pages call it again when settings change.
window.EnsembleAppearance = function (a) {
  a = a || {};
  var el = document.documentElement, mq = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
  var theme = a.theme === 'system' ? (mq('(prefers-color-scheme: light)') ? 'light' : 'dark') : (a.theme || 'dark');
  var motion = a.motion === 'on' || (a.motion !== 'off' && mq('(prefers-reduced-motion: reduce)')) ? 'reduce' : 'full';
  el.setAttribute('data-theme', theme);
  el.setAttribute('data-font', a.storyFont === 'sans' ? 'sans' : 'serif');
  el.setAttribute('data-spacing', a.lineSpacing === 'relaxed' ? 'relaxed' : 'normal');
  el.setAttribute('data-motion', motion);
  el.style.setProperty('--text-scale', String(Math.min(150, Math.max(90, Number(a.textSize) || 100)) / 100));
};
try { window.EnsembleAppearance(JSON.parse(localStorage.getItem('ensemble.appearance')) || (JSON.parse(localStorage.getItem('ensemble.settings')) || {}).appearance); } catch (e) { window.EnsembleAppearance(); }
</script>
</head>
<body class="page-doorway">
<header class="topbar">
  <div class="group"></div>
  <div class="spacer"></div>
  <div class="group"></div>
</header>
<main class="page"><p class="muted">Opening Ensemble…</p></main>

<dialog id="setup">
  <form method="dialog" class="settings setup">
    <h3>Welcome to Ensemble</h3>
    <div class="muted">Ensemble needs a language model to write the story. How do you want to run it?</div>
    <button value="external" class="choice"><b>A hosted model (API key)</b><span>OpenRouter or any OpenAI-compatible service. Works on any computer and costs a little per turn.</span></button>
    <button value="local" class="choice"><b>KoboldCpp on this computer</b><span>Free and private, but needs a capable graphics card.</span><span id="setupLocal" class="small"></span></button>
    <button value="hybrid" class="choice"><b>Both</b><span>The hosted model plays the characters and narrates; KoboldCpp keeps the records.</span></button>
    <div class="row end"><button value="skip" class="ghost">Decide later</button></div>
  </form>
</dialog>

<script src="js/util.js"></script>
<script src="js/adapters.js"></script>
<script src="js/jsonshape.js"></script>
<script src="js/llm.js"></script>
<script src="js/pagecheck.js"></script>
<script src="js/ui/header.js"></script>
<script src="js/ui/shared.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/ui/doorway.js"></script>
</body>
</html>
